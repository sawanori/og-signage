# journald を揮発メモリ（/run/log/journal）だけに保存し、上限をつける（SD カードへの書き込み抑制）。
# 置き場所: /etc/systemd/journald.conf.d/sharehouse-signage.conf（install.sh が配置）
# 再起動でログは消える。Agent の重要なログは Agent 自身が上限つきで保存し、サーバーへ送る。
[Journal]
Storage=volatile
RuntimeMaxUse=64M
RuntimeMaxFileSize=8M
# rsyslog などが入っていても、そこ経由で /var/log へ書かせない
ForwardToSyslog=no
